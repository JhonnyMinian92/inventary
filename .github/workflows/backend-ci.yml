name: backend-ci
on:
  push:
    branches: [master]
    paths:
      - "microservices-inventary-ecuapp/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "microservices-inventary-ecuapp/**"
      - ".github/workflows/backend-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventary
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: CLAVESECRETA
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: microservices-inventary-ecuapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: microservices-inventary-ecuapp/pom.xml
      - name: Verify with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/inventary
          DB_USERNAME: postgres
          DB_PASSWORD: CLAVESECRETA
          JWT_SECRET: ci-only-secret-key-32-bytes-or-longer-please
          BOOTSTRAP_ADMIN_USERNAME: ci-admin
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password-123!
        run: mvn -B verify
