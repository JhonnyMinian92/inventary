name: backend-ci

on:
  push:
    branches: [master]
    paths:
      - "microservices-inventary-ecuapp/src/**"
      - "microservices-inventary-ecuapp/pom.xml"
      - "microservices-inventary-ecuapp/mvnw"
      - "microservices-inventary-ecuapp/.mvn/**"
      - "microservices-inventary-ecuapp/Dockerfile"
      - "microservices-inventary-ecuapp/docker-compose.yml"
      - "microservices-inventary-ecuapp/.env.example"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "microservices-inventary-ecuapp/src/**"
      - "microservices-inventary-ecuapp/pom.xml"
      - "microservices-inventary-ecuapp/mvnw"
      - "microservices-inventary-ecuapp/.mvn/**"
      - "microservices-inventary-ecuapp/Dockerfile"
      - "microservices-inventary-ecuapp/docker-compose.yml"
      - "microservices-inventary-ecuapp/.env.example"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo de la validación manual"
        required: false
        default: "Validación solicitada tras completar la implementación fuente"

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify with PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventary_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: microservices-inventary-ecuapp
    env:
      TEST_DATASOURCE_URL: jdbc:postgresql://localhost:5432/inventary_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: ci-only-postgres-password
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-postgres-password
      JWT_SECRET: ci-only-secret-key-32-bytes-or-longer-please
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_PASSWORD: ElZeus2@23
      SWAGGER_ENABLED: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: microservices-inventary-ecuapp/pom.xml
      - name: Verify Maven wrapper
        run: test -f ./mvnw && chmod +x ./mvnw
      - name: Verify with Maven and PostgreSQL 16
        run: ./mvnw -B --no-transfer-progress verify
      - name: Validate Docker Compose configuration
        env:
          DB_USERNAME: ci-postgres
          DB_PASSWORD: ci-only-compose-password
          JWT_SECRET: ci-only-jwt-secret-key-at-least-32-bytes
        run: |
          docker compose config --quiet
          docker compose --profile kafka config --quiet
      - name: Smoke test Docker Compose from an empty PostgreSQL volume
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_USERNAME: ci-postgres
          DB_PASSWORD: ci-only-compose-password
          JWT_SECRET: ci-only-jwt-secret-key-at-least-32-bytes
          BOOTSTRAP_ADMIN_USERNAME: ci-admin
          BOOTSTRAP_ADMIN_PASSWORD: ElZeus2@23
          SWAGGER_ENABLED: "false"
          GRAPHIQL_ENABLED: "false"
          POSTGRES_PORT: "55432"
          API_PORT: "18080"
          MEDIA_STORAGE_PATH: /data/product-images
          KAFKA_ENABLED: "false"
        run: |
          docker compose up --build -d
          for attempt in $(seq 1 48); do
            if curl --silent --show-error --fail http://localhost:18080/actuator/health >/dev/null; then
              echo "API healthcheck passed after $attempt attempt(s)."
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color api postgres
          exit 1
      - name: Clean up Docker Compose smoke-test resources
        if: always()
        env:
          DB_USERNAME: ci-postgres
          DB_PASSWORD: ci-only-compose-password
          JWT_SECRET: ci-only-jwt-secret-key-at-least-32-bytes
          POSTGRES_PORT: "55432"
          API_PORT: "18080"
        run: docker compose down --volumes --remove-orphans
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: microservices-inventary-ecuapp/target/surefire-reports
          if-no-files-found: warn
