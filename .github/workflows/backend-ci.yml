name: backend-ci
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo de la validación manual"
        required: false
        default: "Validación solicitada tras completar la implementación fuente"
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Maven verify with PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventary
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventary"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: microservices-inventary-ecuapp
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: microservices-inventary-ecuapp/pom.xml
      - name: Verify with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/inventary
          DB_USERNAME: postgres
          DB_PASSWORD: ci-only-postgres-password
          JWT_SECRET: ci-only-secret-key-32-bytes-or-longer-please
          BOOTSTRAP_ADMIN_USERNAME: ci-admin
          BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password-123!
          SWAGGER_ENABLED: "false"
        run: mvn -B verify
