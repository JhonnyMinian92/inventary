name: Frontend Build (manual after source completion)

on:
  workflow_dispatch:
    inputs:
      confirm_source_complete:
        description: "Marca esta opción solo cuando el 100% del código fuente esté completo."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.confirm_source_complete == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-inventary-ecuapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
