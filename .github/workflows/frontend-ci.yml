name: Frontend Build

on:
  push:
    branches: [master]
    paths:
      - "app-inventary-ecuapp/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "app-inventary-ecuapp/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app-inventary-ecuapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-inventary-ecuapp/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Frontend unit tests
        run: npm test
      - name: Build production frontend
        run: npm run build
