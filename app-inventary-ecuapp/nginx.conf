server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Redirecciones relativas: conservan el host y puerto que usó el navegador (p. ej. localhost:3000).
  absolute_redirect off;

  # Product image uploads are accepted up to MEDIA_MAX_REQUEST_SIZE (6 MB by default) by the API.
  client_max_body_size 10m;

  # La aplicación vive en /inventary/. /inventary sin barra y cualquier ruta fuera del prefijo se redirigen dentro de él
  # (el fragmento #/... de los enlaces antiguos lo conserva el navegador y la SPA lo convierte en ruta).
  location = /inventary {
    return 301 /inventary/$is_args$args;
  }

  location /inventary/api/ {
    proxy_pass http://api:8080/api/;
    # Keep the browser host so Spring treats same-origin requests as such (no CORS rejection).
    proxy_set_header Host $http_host;
    # Dirección real del cliente para el rate limit y la auditoría. Se sobrescribe (no se concatena) para que el cliente
    # no pueda inyectarla, y se eliminan las demás cabeceras X-Forwarded-* que Tomcat confiaría.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header Forwarded "";
    proxy_read_timeout 120s;
  }

  location /inventary/assets/ {
    include /etc/nginx/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /inventary/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /inventary/index.html;
  }

  location / {
    return 302 /inventary$request_uri;
  }
}
