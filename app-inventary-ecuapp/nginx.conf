server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Product image uploads are accepted up to MEDIA_MAX_REQUEST_SIZE (6 MB by default) by the API.
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://api:8080;
    # Keep the browser host so Spring treats same-origin requests as such (no CORS rejection).
    proxy_set_header Host $http_host;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
