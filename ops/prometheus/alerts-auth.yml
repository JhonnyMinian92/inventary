groups:
  - name: inventary-auth-security
    interval: 1m
    rules:
      - alert: InventaryAuthenticationFailuresHigh
        expr: sum(increase(inventary_auth_authentication_total{outcome="failed"}[5m])) > 20
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Aumento de autenticaciones fallidas"
          description: "Se registraron más de 20 fallos de autenticación en cinco minutos."
      - alert: InventaryUnauthorizedRequestsHigh
        expr: sum(increase(inventary_auth_authentication_errors_total[5m])) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Aumento de errores de autenticación HTTP"
          description: "Se registraron más de 30 solicitudes no autenticadas en cinco minutos."
      - alert: InventaryAccountLockoutsHigh
        expr: sum(increase(inventary_auth_lockouts_total[10m])) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Aumento de bloqueos de cuentas"
          description: "Se detectaron más de 10 eventos de bloqueo en diez minutos."
      - alert: InventaryRateLimitEventsHigh
        expr: sum(increase(inventary_auth_rate_limited_total[5m])) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Picos de solicitudes limitadas"
          description: "La API está rechazando un volumen anómalo de solicitudes por límite."
      - alert: InventaryMfaVerificationFailuresHigh
        expr: sum(increase(inventary_auth_mfa_total{outcome=~"invalid_code|enrollment_failed"}[5m])) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Aumento de verificaciones MFA fallidas"
          description: "Se detectaron múltiples códigos TOTP inválidos; revisar posible ataque o problemas de sincronización horaria."
      - alert: InventaryAuthenticationEmailDeliveryFailures
        expr: sum(increase(inventary_auth_email_total{outcome="failed"}[10m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Falló la entrega de correo de autenticación"
          description: "Revisar SMTP y la entrega de recuperación/verificación de cuentas."
