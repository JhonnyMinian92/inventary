services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventary
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CLAVESECRETA}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - inventary-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d inventary"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventary
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-CLAVESECRETA}
      JWT_SECRET: ${JWT_SECRET:-local-compose-jwt-secret-change-me-please-32-bytes}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "${API_PORT:-8080}:8080"
volumes:
  inventary-postgres-data:
