services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventary
      POSTGRES_USER: ${DB_USERNAME:?Define DB_USERNAME en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - inventary-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:?Define DB_USERNAME en .env} -d inventary"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
  kafka:
    image: apache/kafka:3.9.1
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - inventary-kafka-data:/var/lib/kafka/data
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventary
      DB_USERNAME: ${DB_USERNAME:?Define DB_USERNAME en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      WHATSAPP_INTEGRATION_API_KEY: ${WHATSAPP_INTEGRATION_API_KEY:-}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-inventary.domain-events}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-inventary.domain-events.DLQ}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-inventary-public-cache}
      KAFKA_CONSUMER_MAX_MESSAGE_BYTES: ${KAFKA_CONSUMER_MAX_MESSAGE_BYTES:-1048576}
      KAFKA_MAX_POLL_RECORDS: ${KAFKA_MAX_POLL_RECORDS:-100}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      GRAPHIQL_ENABLED: ${GRAPHIQL_ENABLED:-false}
      REPORTS_TIME_ZONE: ${REPORTS_TIME_ZONE:-America/Guayaquil}
      PURCHASING_REQUIRE_DISTINCT_APPROVER: ${PURCHASING_REQUIRE_DISTINCT_APPROVER:-true}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      MEDIA_STORAGE_PATH: ${MEDIA_STORAGE_PATH:-/data/product-images}
      MEDIA_MAX_FILE_SIZE: ${MEDIA_MAX_FILE_SIZE:-5MB}
      MEDIA_MAX_REQUEST_SIZE: ${MEDIA_MAX_REQUEST_SIZE:-6MB}
      MEDIA_MAX_REQUEST_BYTES: ${MEDIA_MAX_REQUEST_BYTES:-6291456}
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-5242880}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
    volumes:
      - inventary-media-data:/data/product-images
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped
volumes:
  inventary-postgres-data:
  inventary-media-data:
  inventary-kafka-data:
