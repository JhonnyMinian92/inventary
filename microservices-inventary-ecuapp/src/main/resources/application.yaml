spring:
  application:
    name: inventary
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventary}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:CLAVESECRETA}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: inventary-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization.fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  api-docs.enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
app:
  security:
    # Solo para desarrollo local; en otros entornos configurar JWT_SECRET.
    jwt-secret: ${JWT_SECRET:inventary-local-dev-key-change-me-32bytes-minimum}
    token-ttl-minutes: ${JWT_TTL_MINUTES:60}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
logging:
  level:
    root: INFO
    org.springframework.security: WARN
