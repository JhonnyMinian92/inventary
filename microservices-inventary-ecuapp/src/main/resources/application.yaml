spring:
  application:
    name: inventary
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:false}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventary}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: inventary-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
        # Lazy collections in paged listings are loaded in batches instead of one query per row.
        default_batch_fetch_size: 50
        query.fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  web:
    # Validation and error messages are produced in Spanish regardless of the client Accept-Language.
    locale: es
    locale-resolver: fixed
  jackson:
    default-property-inclusion: non_null
    deserialization.fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  # "none" by default: X-Forwarded-For is ignored. Set FORWARD_HEADERS_STRATEGY=native only behind a trusted proxy
  # (Tomcat then accepts forwarded addresses exclusively from internal proxy ranges).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: ${HTTP_CONNECTION_TIMEOUT:20s}
    max-swallow-size: 2MB
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  api-docs.enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
management:
  endpoints.web.exposure.include: health,info,metrics
  # URI tags are route templates (bounded cardinality); the API exposes ~140 templates.
  metrics.web.server.max-uri-tags: 300
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate.enabled: true
    readinessstate.enabled: true
app:
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl-minutes: ${JWT_TTL_MINUTES:60}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    max-request-body-bytes: ${MAX_REQUEST_BODY_BYTES:1048576}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topic: ${KAFKA_TOPIC:inventary.domain-events}
    poll-delay-ms: ${KAFKA_POLL_DELAY_MS:1000}
  integrations:
    whatsapp:
      api-key: ${WHATSAPP_INTEGRATION_API_KEY:}
      quote-ttl-minutes: ${WHATSAPP_QUOTE_TTL_MINUTES:10}
      order-ttl-minutes: ${WHATSAPP_ORDER_TTL_MINUTES:20}
      expiry-check-ms: ${WHATSAPP_EXPIRY_CHECK_MS:60000}
  purchasing:
    # Segregation of duties: the approver must differ from the user who created or submitted the order.
    require-distinct-approver: ${PURCHASING_REQUIRE_DISTINCT_APPROVER:true}
  reports:
    time-zone: ${REPORTS_TIME_ZONE:America/Guayaquil}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
