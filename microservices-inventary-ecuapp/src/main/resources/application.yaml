spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:false}
  application:
    name: inventary
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventary}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:CLAVESECRETA}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: inventary-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization.fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  api-docs.enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
app:
  security:
    # JWT_SECRET es obligatorio en todos los entornos; usa .env.example solo para desarrollo local.
    jwt-secret: ${JWT_SECRET}
    token-ttl-minutes: ${JWT_TTL_MINUTES:60}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topic: ${KAFKA_TOPIC:inventary.domain-events}
    poll-delay-ms: ${KAFKA_POLL_DELAY_MS:1000}
  integrations:
    whatsapp:
      api-key: ${WHATSAPP_INTEGRATION_API_KEY:}
      quote-ttl-minutes: ${WHATSAPP_QUOTE_TTL_MINUTES:10}
      order-ttl-minutes: ${WHATSAPP_ORDER_TTL_MINUTES:20}
      expiry-check-ms: ${WHATSAPP_EXPIRY_CHECK_MS:60000}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
logging:
  level:
    root: INFO
    org.springframework.security: WARN
