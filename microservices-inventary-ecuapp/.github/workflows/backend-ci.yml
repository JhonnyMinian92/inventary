name: Backend CI

on:
  push:
    branches: [master]
    paths:
      - "microservices-inventary-ecuapp/**"
      - ".github/workflows/backend-ci.yml"
      - "microservices-inventary-ecuapp/.github/workflows/backend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "microservices-inventary-ecuapp/**"
      - ".github/workflows/backend-ci.yml"
      - "microservices-inventary-ecuapp/.github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventary_test
          POSTGRES_USER: inventary
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventary -d inventary_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATASOURCE_URL: jdbc:postgresql://localhost:5432/inventary_test
      TEST_DB_USERNAME: inventary
      TEST_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Maven wrapper
        run: test -x microservices-inventary-ecuapp/mvnw
      - name: Verify backend and PostgreSQL 16
        working-directory: microservices-inventary-ecuapp
        run: ./mvnw -B --no-transfer-progress verify
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: microservices-inventary-ecuapp/target/surefire-reports
          if-no-files-found: warn
